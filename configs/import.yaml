# Import d'un jeu de donnees telecharge.
# Lu par scripts/import_dataset.py.

# Dossier du jeu telecharge et decompresse. Il doit contenir un data.yaml
# (export Roboflow, Kaggle ou tout export au format YOLO).
source: data/raw/bmd45_subset

# Correspondance entre les classes du jeu telecharge et nos 4 classes.
#
# A gauche : le nom exact tel qu'il figure dans le data.yaml du jeu source.
# A droite : voiture, moto, bus, camion, ou `ignorer`.
#
# Toute classe source absente de cette liste est signalee au lancement et
# ignoree. Lancez le script une premiere fois : il affiche la liste des classes
# reellement presentes dans votre jeu, que vous n'avez plus qu'a recopier ici.
correspondance:
  # Voitures
  Hatchback: voiture
  Sedan: voiture
  SUV: voiture
  MUV: voiture
  Van: voiture
  van: voiture

  # Motos
  Two-wheeler: moto
  two-wheeler: moto
  motorcycle: moto
  motorbike: moto
  bike: moto

  # Bus
  Bus: bus
  bus: bus
  Mini-bus: bus
  minibus: bus
  Tempo-traveller: bus
  Tempo-traveler: bus

  # Camions
  Truck: camion
  truck: camion
  LCV: camion
  lorry: camion

  # Classes hors périmètre
  Three-wheeler: ignorer
  three-wheeler: ignorer
  Bicycle: ignorer
  bicycle: ignorer
  Other: ignorer
  other: ignorer